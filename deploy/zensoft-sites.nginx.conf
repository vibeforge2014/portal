# zensoft.top 产品站点静态目录（由各 app 仓库 GitHub Actions rsync 部署）
# 挂到 zensoft.top server 块：include 或复制进 server {} 均可。

location ^~ /visto/ {
    alias /var/www/zensoft/sites/visto/;
    try_files $uri $uri/ $uri/index.html =404;
}

# MinuteFlow 是 SPA：未知路径回落到 404.html（构建时复制的 index 副本），
# 由前端路由渲染 /pricing/ 等页面，以 200 状态返回。
location ^~ /minuteflow/ {
    alias /var/www/zensoft/sites/minuteflow/;
    try_files $uri $uri/ $uri/index.html =404;
    error_page 404 =200 /minuteflow/404.html;
}

location ^~ /chargepilot/ {
    alias /var/www/zensoft/sites/chargepilot/;
