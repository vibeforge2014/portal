# 主服务器（101.37.124.50，已备案，唯一公网入口）的 zensoft 站点配置
# 架构：nginx 即 SLB —— 公开流量在本机 Node、二号节点(139.224.228.193:8443)
#       与三号节点(当前 39.184.194.28:8444，动态 IP)间轮询；
#       后台(/admin、/api/admin)固定本机，保证 SQLite 单写者与会话一致。
# 部署：覆盖 /etc/nginx/conf.d/zensoft.conf 后 `nginx -t && systemctl reload nginx`

limit_req_zone $binary_remote_addr zone=pdf_convert_submit:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=pdf_convert_poll:10m rate=30r/m;

upstream zensoft_app {
    server 127.0.0.1:3000 max_fails=2 fail_timeout=10s;
    server 139.224.228.193:8443 max_fails=3 fail_timeout=15s;
    server 39.184.194.28:8444 max_fails=3 fail_timeout=15s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 101.37.124.50 zensoft.top www.zensoft.top;

    client_max_body_size 12m;

    location ^~ /admin {
        return 301 https://$host$request_uri;
    }

    location ^~ /api/admin {
        return 301 https://$host$request_uri;
    }

    location ^~ /api/pdf-convert/ {
        return 308 https://$host$request_uri;
    }

    include /etc/nginx/snippets/zensoft-sites.conf;
    include /etc/nginx/snippets/zensoft-static-meta.conf;

    location / {
        proxy_pass http://zensoft_app;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 101.37.124.50 zensoft.top www.zensoft.top;

    ssl_certificate /etc/zensoft/tls/zensoft-selfsigned.crt;
    ssl_certificate_key /etc/zensoft/tls/zensoft-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZenSoftSSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    include /etc/nginx/snippets/zensoft-sites.conf;
    include /etc/nginx/snippets/zensoft-static-meta.conf;

    location = /api/pdf-convert/jobs/ {
        client_max_body_size 11m;
        limit_req zone=pdf_convert_submit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass https://39.184.194.28:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name zensoft.top;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Host www.zensoft.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/pdf-convert/ {
        limit_req zone=pdf_convert_poll burst=15 nodelay;
        limit_req_status 429;
        proxy_pass https://39.184.194.28:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name zensoft.top;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Host www.zensoft.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 后台页面固定本机（登录会话存主库）
    location ^~ /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 后台 API 固定本机（SQLite 单写者：发布/上传/订单只写主库）
    location ^~ /api/admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://zensoft_app;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
