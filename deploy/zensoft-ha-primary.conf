# 主服务器（101.37.124.50，已备案，唯一公网入口）的 zensoft 站点配置
# 架构：nginx 即 SLB —— 公开流量在本机 Node 与二号节点(139.224.228.193:8443 内网后端)间轮询；
#       后台(/admin、/api/admin)固定本机，保证 SQLite 单写者与会话一致。
# 部署：覆盖 /etc/nginx/conf.d/zensoft.conf 后 `nginx -t && systemctl reload nginx`

upstream zensoft_app {
    server 127.0.0.1:3000 max_fails=2 fail_timeout=10s;
    server 139.224.228.193:8443 max_fails=3 fail_timeout=15s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 101.37.124.50 zensoft.top www.zensoft.top;

    client_max_body_size 12m;

    location ^~ /admin {
        return 301 https://$host$request_uri;
    }

    location ^~ /api/admin {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/snippets/zensoft-sites.conf;

    location / {
        proxy_pass http://zensoft_app;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 101.37.124.50 zensoft.top www.zensoft.top;

    ssl_certificate /etc/zensoft/tls/zensoft-selfsigned.crt;
    ssl_certificate_key /etc/zensoft/tls/zensoft-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZenSoftSSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    include /etc/nginx/snippets/zensoft-sites.conf;

    # 后台页面固定本机（登录会话存主库）
    location ^~ /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 后台 API 固定本机（SQLite 单写者：发布/上传/订单只写主库）
    location ^~ /api/admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://zensoft_app;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
