# 二号节点（139.224.228.193，未备案，禁止任何公网 Web 服务）
# 角色：内网后端 —— 仅接受主服务器(101.37.124.50)的反代流量，非标端口 8443。
# 部署：放至 /etc/nginx/conf.d/zensoft-internal.conf，并删除原 80/443 的 zensoft.conf；
#       建议同时在阿里云安全组将 8443 入站限制为 101.37.124.50（nginx allow/deny 之外再加一层）。

server {
    listen 8443;
    server_name zensoft-internal-origin;

    client_max_body_size 12m;

    allow 101.37.124.50;
    deny all;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 产品子站从本地同步目录直接出（主服务器每 5 分钟 rsync 保持一致）
    include /etc/nginx/snippets/zensoft-sites.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # 应用按 Host 生成跳转/元数据，固定写公网域名（两种域名归一到 www）
        proxy_set_header Host www.zensoft.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
