# Fast, reliable metadata responses at the public nginx entry point.
# Refresh /var/www/zensoft/sitemap.xml from the app's generated sitemap on each release.
location = /robots.txt {
    types { }
    default_type text/plain;
    add_header Cache-Control "public, max-age=14400" always;
    return 200 "User-Agent: *\nAllow: /\nDisallow: /admin\nDisallow: /api/admin\n\nSitemap: https://zensoft.top/sitemap.xml\n";
}

location = /sitemap.xml {
    types { }
    default_type application/xml;
    add_header Cache-Control "public, max-age=300" always;
    root /var/www/zensoft;
}
