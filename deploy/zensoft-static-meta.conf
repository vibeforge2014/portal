# robots/sitemap 固定内容直接由 nginx 返回：微秒级响应、不进 Node upstream、
# 不受应用重启/同步窗口影响（修 Lighthouse "fetch robots.txt timed out"）。
# 内容与 src/app/robots.ts / sitemap.ts 保持一致 —— 改应用侧时同步改这里。
# types{} 空块禁用按扩展名取 mime（否则 .xml 会被强制成 text/xml）。
# 部署：拷到 /etc/nginx/snippets/zensoft-static-meta.conf，并在 zensoft.conf 两个
# server 块的 zensoft-sites.conf include 之后各加一行 include 本文件。
location = /robots.txt {
    types { }
    default_type text/plain;
    add_header Cache-Control "public, max-age=14400" always;
    return 200 "User-Agent: *\nAllow: /\nDisallow: /admin\nDisallow: /api/admin\n\nSitemap: https://zensoft.top/sitemap.xml\n";
}
location = /sitemap.xml {
    types { }
    default_type application/xml;
    add_header Cache-Control "public, max-age=14400" always;
    return 200 "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n<url>\n<loc>https://zensoft.top/</loc>\n<changefreq>weekly</changefreq>\n<priority>1</priority>\n</url>\n</urlset>\n";
}
