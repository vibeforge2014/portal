map $http_upgrade $zensoft_nas_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name nas.zensoft.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nas.zensoft.top;

    ssl_certificate /etc/zensoft/tls/zensoft-selfsigned.crt;
    ssl_certificate_key /etc/zensoft/tls/zensoft-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZenSoftSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10g;

    location / {
        proxy_pass https://zqian24.synology.me:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zensoft_nas_connection;

        proxy_ssl_server_name on;
        proxy_ssl_name zqian24.synology.me;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify_depth 3;

        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_redirect https://zqian24.synology.me:5001/ https://nas.zensoft.top/;
        proxy_cookie_domain zqian24.synology.me nas.zensoft.top;
    }
}
