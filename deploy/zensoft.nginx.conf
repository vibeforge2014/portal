server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 101.37.124.50 zensoft.top www.zensoft.top;

    client_max_body_size 12m;

    location ^~ /admin {
        return 301 https://$host$request_uri;
    }

    location ^~ /api/admin {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 101.37.124.50 zensoft.top www.zensoft.top;

    ssl_certificate /etc/zensoft/tls/zensoft-selfsigned.crt;
    ssl_certificate_key /etc/zensoft/tls/zensoft-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZenSoftSSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
